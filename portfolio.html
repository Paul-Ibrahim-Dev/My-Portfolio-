<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfon — Paul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone-frame">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">△</span>
        <span class="logo-text">Portfon</span>
      </div>
      <button class="menu-btn" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>
    <section class="hero">

      <div class="hero-visual">
        <span class="bg-text">DESIGN</span>
        <div class="arch"></div>

        <img
          class="portrait"
          src="profile.jpeg"
          alt="Portrait of Arion"
        />
        <div class="floating-label label-1">
          <span class="dot"></span> Web design
        </div>
        <div class="floating-label label-2">
          <span class="dot"></span> Web design
        </div>

        <div class="stats-card">
          <div class="stats-text">
            <span> Crafting</span>
            <span>Digital Products</span>
          </div>
          <div class="stats-number">5+</div>
        </div>
      </div>

      <div class="hero-content">
        <p class="greeting">Hey, I'm Paul.</p>
        <h1 class="headline">Product, UI/UX  Brand Design</h1>
      </div>

    </section>
    <section class="about">
      <p class="eyebrow"><span class="star">★</span> ABOUT ME</p>
      <p class="about-text">
        I create thoughtful digital experiences rooted in strategy, usability, and
        design.
      </p>
    </section>

  </div>
